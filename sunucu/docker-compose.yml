# SMN Bilişim Uzaktan Yardım - bağlantı sunucusu
# hbbs: ID / kayıt sunucusu, hbbr: aktarma (relay) sunucusu
# "-k _" : sadece SMN anahtarına sahip istemciler bağlanabilir
services:
  hbbs:
    container_name: smn-hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r ${SMN_ALAN_ADI}:21117 -k _
    network_mode: host
    volumes:
      - ./data:/root
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: smn-hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    network_mode: host
    volumes:
      - ./data:/root
    restart: unless-stopped
